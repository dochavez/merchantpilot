# Render Blueprint – one click deploy: https://render.com/deploy?repo=<your-github-repo-url>
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: merchantpilot
    runtime: node
    region: oregon
    # "starter" never sleeps, so judges never hit a cold start. Covered by the hackathon's $50 Render credit.
    # Use "free" while developing (sleeps after 15 min idle, ~1 min wake-up).
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # --- PayPal sandbox (leave empty to run on built-in demo data)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MERCHANT_NAME
        value: Altura Coffee Supply (sandbox)
      # Set to 1 to force demo data even when PayPal keys exist (recommended for the public judge URL
      # if your sandbox has little activity).
      - key: FORCE_DEMO
        value: "0"
      # With PayPal keys, visitors open "Altura Coffee Supply (demo)" (the full demo story) first and
      # the live sandbox business is one click away in the business menu. Set to "primary" to open
      # the live sandbox first instead.
      - key: DEFAULT_BUSINESS
        sync: false
      # --- AI model (one of the two)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      # claude-haiku-4-5 = cheap while testing; switch to claude-sonnet-4-5 for the video / judging
      - key: LLM_MODEL
        value: claude-haiku-4-5
      # --- Abuse protection for the public demo
      # Per visitor IP, and a global daily safety cap. Sized so judges are never blocked during
      # judging (Dec 1-15); check your model provider balance covers it.
      - key: LLM_TURNS_PER_10_MIN
        value: "60"
      - key: LLM_DAILY_TURN_CAP
        value: "1500"
      # --- Persistence: audit trail, approval rules, reminder history survive redeploys
      - key: DATABASE_URL
        fromDatabase:
          name: merchantpilot-db
          property: connectionString
      # --- Morning brief: signed approve links + optional daily email (Resend)
      - key: APP_URL
        value: https://merchantpilot.onrender.com
      - key: BRIEF_SIGNING_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: BRIEF_EMAIL_TO
        sync: false
      # --- Optional: protects the Power BI / Excel OData feed (/api/odata) and export URLs
      - key: EXPORT_API_KEY
        sync: false
      # --- Set to true to hide the two built-in demo businesses (portfolio shows only your PayPal apps)
      - key: HIDE_DEMO_BUSINESSES
        value: "false"
      # --- AG Studio trial license (baked into the client bundle at build time)
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  # Optional daily morning brief email (~cents/month). Uncomment, then set CRON_SECRET to the same
  # value as the web service (Render → merchantpilot → Environment) and RESEND_API_KEY / BRIEF_EMAIL_TO there.
  # - type: cron
  #   name: merchantpilot-morning-brief
  #   runtime: docker
  #   image:
  #     url: docker.io/curlimages/curl:latest
  #   schedule: "0 13 * * *"   # 13:00 UTC
  #   dockerCommand: sh -c 'curl -fsS -X POST https://merchantpilot.onrender.com/api/brief/send -H "Authorization: Bearer $CRON_SECRET"'
  #   envVars:
  #     - key: CRON_SECRET
  #       sync: false

databases:
  # Postgres for the Action Center audit trail and approval rules. "basic-256mb" (~$6/month) does
  # not expire; Render's free Postgres is deleted 30 days after creation (would die before judging).
  - name: merchantpilot-db
    plan: basic-256mb
    region: oregon
    databaseName: merchantpilot
    user: merchantpilot
